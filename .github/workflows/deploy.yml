name: Deploy to WordPress.org SVN
on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: |
          mkdir -p build
          # Copy only the files needed for the plugin
          cp -r assets build/
          cp -r includes build/
          cp -r languages build/
          cp briqpay-for-woocommerce.php build/
          cp readme.txt build/
          cp LICENSE build/

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: briqpay-for-woocommerce
          BUILD_DIR: build
          ASSETS_DIR: none