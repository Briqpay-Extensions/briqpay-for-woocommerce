name: Deploy to WordPress.org SVN
on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Composer dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          
          rm -rf vendor/phpunit
          rm -rf vendor/sebastian
          rm -rf vendor/phar-io
          rm -rf vendor/theseer
          rm -rf vendor/nikic
          rm -rf vendor/myclabs
          rm -rf vendor/mockery
          rm -rf vendor/hamcrest
          rm -rf vendor/doctrine
          rm -rf vendor/antecedent
          rm -rf vendor/10up
          
          find vendor -type d -name ".git" -exec rm -rf {} +
          find vendor -type d -name ".svn" -exec rm -rf {} +
          find vendor -type d -name ".github" -exec rm -rf {} +
          find vendor -type l -delete

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: briqpay-for-woocommerce